name: model-compat-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          HAS_MODEL_NAME: ${{ secrets.MSWEA_MODEL_NAME != '' }}
          HAS_API_KEY: ${{ secrets.THIRD_PARTY_API_KEY != '' }}
          HAS_API_BASE: ${{ secrets.THIRD_PARTY_API_BASE != '' }}
        run: |
          if [ "$HAS_MODEL_NAME" != "true" ] || [ "$HAS_API_KEY" != "true" ] || [ "$HAS_API_BASE" != "true" ]; then
            echo "Required secrets are missing."
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Probe raw OpenAI-compatible response
        env:
          MSWEA_MODEL_NAME: ${{ secrets.MSWEA_MODEL_NAME }}
          THIRD_PARTY_API_KEY: ${{ secrets.THIRD_PARTY_API_KEY }}
          THIRD_PARTY_API_BASE: ${{ secrets.THIRD_PARTY_API_BASE }}
        run: |
          MODEL_NAME="${MSWEA_MODEL_NAME#openai/}"
          BASE_URL="${THIRD_PARTY_API_BASE%/}"
          mkdir -p .probe
          curl -sS \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $THIRD_PARTY_API_KEY" \
            "$BASE_URL/chat/completions" \
            -d "$(cat <<EOF
          {
            "model": "$MODEL_NAME",
            "messages": [
              {"role": "user", "content": "Reply with exactly the word pong."}
            ],
            "temperature": 0
          }
          EOF
          )" > .probe/raw-response.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          raw = Path(".probe/raw-response.json").read_text()
          print("=== RAW RESPONSE ===")
          print(raw[:4000])

          data = json.loads(raw)
          print("\n=== TOP-LEVEL KEYS ===")
          print(sorted(data.keys()))
          if "choices" in data and data["choices"]:
              print("\n=== FIRST CHOICE ===")
              print(json.dumps(data["choices"][0], ensure_ascii=False)[:4000])
          PY

      - name: Probe LiteLLM compatibility
        env:
          MSWEA_MODEL_NAME: ${{ secrets.MSWEA_MODEL_NAME }}
          THIRD_PARTY_API_KEY: ${{ secrets.THIRD_PARTY_API_KEY }}
          THIRD_PARTY_API_BASE: ${{ secrets.THIRD_PARTY_API_BASE }}
        run: |
          uv run --with litellm python - <<'PY'
          import json
          import os
          import traceback
          from litellm import completion

          try:
              resp = completion(
                  model=os.environ["MSWEA_MODEL_NAME"],
                  api_key=os.environ["THIRD_PARTY_API_KEY"],
                  api_base=os.environ["THIRD_PARTY_API_BASE"],
                  custom_llm_provider="openai",
                  messages=[{"role": "user", "content": "Reply with exactly the word pong."}],
                  temperature=0,
              )
              print("=== LITELLM RESPONSE ===")
              print(resp.model_dump_json(indent=2)[:4000])
          except Exception as exc:
              print("=== LITELLM EXCEPTION ===")
              print(type(exc).__name__)
              print(str(exc))
              print("\n=== TRACEBACK ===")
              traceback.print_exc()
              raise
          PY

      - name: Probe review-style prompt compatibility
        env:
          MSWEA_MODEL_NAME: ${{ secrets.MSWEA_MODEL_NAME }}
          THIRD_PARTY_API_KEY: ${{ secrets.THIRD_PARTY_API_KEY }}
          THIRD_PARTY_API_BASE: ${{ secrets.THIRD_PARTY_API_BASE }}
        run: |
          uv run --with litellm python - <<'PY'
          import json
          import os
          import traceback
          from litellm import completion

          system_prompt = (
              "You are a careful pull request reviewer working in a local git checkout. "
              "Focus on correctness bugs, regressions, security risks, and missing tests."
          )

          user_prompt = """Review this pull request:

<task>
PR #1
Title: test: mini-swe-agent workflow smoke test

PR body:
## Summary
- add a harmless README line to trigger the mini-swe-agent workflow

## Test Plan
- comment /mini-swe on this PR

Trigger comment:
/mini-swe

Reviewer request:
Review the current pull request and return only actionable review findings.
</task>

Rules:
- Do not modify tracked repository files.
- Use bash commands only if needed for read-only checks.
- Keep the review narrow. Only inspect files directly relevant to the pull request.
- Do not explore the entire repository.
- Stop once you have enough evidence for a concise review.

Expected output format:
## mini-swe-agent review
### Findings
- [high|medium|low] path:line - issue and why it matters

### Tests
- Commands run or "Not run"

### Verdict
- One short summary sentence

If you found no material issues, say "No material findings."
"""

          try:
              resp = completion(
                  model=os.environ["MSWEA_MODEL_NAME"],
                  api_key=os.environ["THIRD_PARTY_API_KEY"],
                  api_base=os.environ["THIRD_PARTY_API_BASE"],
                  custom_llm_provider="openai",
                  messages=[
                      {"role": "system", "content": system_prompt},
                      {"role": "user", "content": user_prompt},
                  ],
                  temperature=0,
              )
              print("=== REVIEW-STYLE LITELLM RESPONSE ===")
              print(resp.model_dump_json(indent=2)[:8000])
          except Exception as exc:
              print("=== REVIEW-STYLE LITELLM EXCEPTION ===")
              print(type(exc).__name__)
              print(str(exc))
              print("\n=== TRACEBACK ===")
              traceback.print_exc()
              raise
          PY
